<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💣 曾棒棒踩地雷 💣</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>💣 曾棒棒踩地雷 💣</h1>
            <div id="game-status">遊戲開始！小心不要踩到地雷。</div>
            <div id="game-info">🚩 剩餘地雷: <span id="mine-count">10</span> ｜ ⏱️ 秒數: <span id="timer">0</span></div>
        </header>

        <!-- 世界排行榜顯示區 -->
        <section class="leaderboard-section">
            <h3>🏆 曾棒棒踩地雷 - 世界速通排行榜 (最少秒數)</h3>
            <ol id="leaderboard-list">
                <li>排行載入中...</li>
            </ol>
        </section>

        <!-- 9x9 遊戲棋盤區 -->
        <main class="game-board-wrapper">
            <div id="minesweeper-board" class="board"></div>
        </main>

        <!-- 遊戲結束彈窗 -->
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="game-result-title">遊戲結束</h2>
                <p id="game-result-text">勝負揭曉</p>
                
                <!-- 分數上傳區 -->
                <div id="upload-score-zone" class="hidden">
                    <input type="text" id="player-name-input" placeholder="輸入你的大名" maxLength="10">
                    <button id="submit-score-btn">📤 上傳通關紀錄</button>
                </div>

                <button id="restart-btn" style="margin-top: 15px;">🔄 再玩一次</button>
            </div>
        </div>
    </div>

    <!-- 💡 注意：Firebase 與 game.js 移到這裡，順序絕對不能錯 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="game.js?v=1.1"></script>
</body>
</html>
